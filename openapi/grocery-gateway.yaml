openapi: 3.1.0
info:
  title: Grocery Gateway API
  version: "1.1.0"
paths:
  /api/grocery/households:
    post:
      operationId: createHousehold
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Household created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/GroceryError"
    get:
      operationId: listHouseholds
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Households available to the shopper
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/households/{id}/invites:
    post:
      operationId: createInvite
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                max_uses:
                  type: integer
      responses:
        "201":
          description: Household invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/invites/{code}/join:
    post:
      operationId: joinHousehold
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Household joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/lists:
    get:
      operationId: listLists
      security:
        - bearerAuth: []
      parameters:
        - name: householdId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Grocery lists available to the shopper
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/GroceryError"
    post:
      operationId: createList
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                household_id:
                  type: string
                  nullable: true
                title:
                  type: string
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/NewItem"
      responses:
        "201":
          description: Grocery list created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/lists/{id}:
    get:
      operationId: getList
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Grocery list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/GroceryError"
    patch:
      operationId: updateList
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListPatch"
      responses:
        "200":
          description: Grocery list updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/lists/{id}/items:
    post:
      operationId: addItems
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/NewItem"
      responses:
        "201":
          description: Grocery list items added
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/lists/{id}/items/{itemId}:
    patch:
      operationId: updateItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPatch"
      responses:
        "200":
          description: Grocery list item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        default:
          $ref: "#/components/responses/GroceryError"
    delete:
      operationId: deleteItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Grocery list item deleted
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/recipes:
    get:
      operationId: listRecipes
      security:
        - bearerAuth: []
      parameters:
        - name: householdId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Recipes available to the shopper
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
        default:
          $ref: "#/components/responses/GroceryError"
    post:
      operationId: createRecipe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedRecipeInput"
      responses:
        "201":
          description: Recipe created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/recipes/{id}:
    get:
      operationId: getRecipe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        default:
          $ref: "#/components/responses/GroceryError"
    put:
      operationId: updateRecipe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeContent"
      responses:
        "200":
          description: Recipe updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/pantry:
    get:
      operationId: getPantry
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pantry items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PantryItem"
        default:
          $ref: "#/components/responses/GroceryError"
    post:
      operationId: addPantryItems
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [name]
                    properties:
                      name:
                        type: string
                      quantity:
                        type: number
                        format: double
                      expires_at:
                        type: integer
                        format: int64
      responses:
        "200":
          description: Updated pantry items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PantryItem"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/pantry/remove:
    post:
      operationId: removePantryItems
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                names:
                  type: array
                  items:
                    type: string
                all:
                  type: boolean
      responses:
        "200":
          description: Updated pantry items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PantryItem"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/pantry/quantity:
    post:
      operationId: setPantryItemQuantity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, quantity]
              properties:
                name:
                  type: string
                quantity:
                  type: number
                  format: double
      responses:
        "200":
          description: Updated pantry items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PantryItem"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/equipment:
    get:
      operationId: getEquipment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Kitchen equipment
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EquipmentItem"
        default:
          $ref: "#/components/responses/GroceryError"
    post:
      operationId: addEquipment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [name]
                    properties:
                      name:
                        type: string
                      category:
                        type: string
      responses:
        "200":
          description: Updated kitchen equipment
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EquipmentItem"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/equipment/remove:
    post:
      operationId: removeEquipment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                names:
                  type: array
                  items:
                    type: string
                all:
                  type: boolean
      responses:
        "200":
          description: Updated kitchen equipment
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EquipmentItem"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/orders:
    get:
      operationId: getOrders
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent shopping orders
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/GroceryError"
    post:
      operationId: recordOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordOrderInput"
      responses:
        "201":
          description: Shopping order recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/preferred-store:
    get:
      operationId: getPreferredStore
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferred store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferredStore"
        default:
          $ref: "#/components/responses/GroceryError"
    put:
      operationId: setPreferredStore
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferredStoreInput"
      responses:
        "200":
          description: Preferred store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferredStore"
        default:
          $ref: "#/components/responses/GroceryError"
    delete:
      operationId: deletePreferredStore
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Preferred store deleted
        default:
          $ref: "#/components/responses/GroceryError"
  /api/grocery/profile:
    get:
      operationId: getShoppingProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Shopping profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingProfile"
        default:
          $ref: "#/components/responses/GroceryError"
components:
  responses:
    GroceryError:
      description: Structured grocery API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Clerk session JWT or shopping MCP OAuth token, verified by route-specific gateway authentication.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ProductReference:
      type: object
      additionalProperties: false
      description: Provider-scoped product identity. The id is opaque outside its provider.
      required: [provider, id]
      properties:
        provider:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        id:
          type: string
          minLength: 1
          maxLength: 255
    Household:
      type: object
      required: [id, name, role, created_by, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        created_by:
          type: string
        created_at:
          type: integer
          format: int64
    Invite:
      type: object
      required: [code, household_id, created_by, expires_at, max_uses, used_count]
      properties:
        code:
          type: string
        household_id:
          type: string
        created_by:
          type: string
        expires_at:
          type: integer
          format: int64
        max_uses:
          type: integer
        used_count:
          type: integer
    List:
      type: object
      required:
        - id
        - household_id
        - owner_user_id
        - title
        - status
        - created_at
        - updated_at
        - items
      properties:
        id:
          type: string
        household_id:
          type: string
          nullable: true
          x-go-type: "*string"
        owner_user_id:
          type: string
        title:
          type: string
        status:
          type: string
        artifact_version:
          type: integer
          format: int64
          x-go-type-skip-optional-pointer: true
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
    Item:
      type: object
      required:
        [id, list_id, name, quantity, note, position, added_by, checked_by, checked_at, updated_at]
      properties:
        id:
          type: string
        list_id:
          type: string
        name:
          type: string
        quantity:
          type: string
        note:
          type: string
          nullable: true
          x-go-type: "*string"
        upc:
          type: string
          nullable: true
          deprecated: true
          description: Legacy Kroger-only identifier. Use product instead.
        product:
          allOf:
            - $ref: "#/components/schemas/ProductReference"
          nullable: true
        position:
          type: integer
        added_by:
          type: string
        checked_by:
          type: string
          nullable: true
          x-go-type: "*string"
        checked_at:
          type: integer
          format: int64
          nullable: true
          x-go-type: "*int64"
        updated_at:
          type: integer
          format: int64
    NewItem:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        quantity:
          type: string
          x-go-type-skip-optional-pointer: true
        note:
          type: string
          nullable: true
        upc:
          type: string
          nullable: true
          deprecated: true
          description: Legacy Kroger-only identifier. Use product instead.
        product:
          allOf:
            - $ref: "#/components/schemas/ProductReference"
          nullable: true
    ItemPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
        quantity:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        checked:
          type: boolean
          nullable: true
    ListPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
    Recipe:
      type: object
      required:
        - id
        - household_id
        - owner_user_id
        - title
        - description
        - servings
        - notes
        - status
        - created_at
        - updated_at
        - ingredients
        - steps
        - tags
      properties:
        id:
          type: string
        household_id:
          type: string
          nullable: true
          x-go-type: "*string"
        owner_user_id:
          type: string
        title:
          type: string
        description:
          type: string
        servings:
          type: string
        notes:
          type: string
        status:
          type: string
        artifact_version:
          type: integer
          format: int64
          x-go-type-skip-optional-pointer: true
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RecipeStep"
        tags:
          type: array
          items:
            type: string
    Ingredient:
      type: object
      required: [id, recipe_id, name, quantity, unit, note, position]
      properties:
        id:
          type: string
        recipe_id:
          type: string
        name:
          type: string
        quantity:
          type: string
        unit:
          type: string
        note:
          type: string
        position:
          type: integer
    RecipeStep:
      type: object
      required: [id, recipe_id, instruction, position]
      properties:
        id:
          type: string
        recipe_id:
          type: string
        instruction:
          type: string
        position:
          type: integer
    NewIngredient:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        quantity:
          type: string
          x-go-type-skip-optional-pointer: true
        unit:
          type: string
          x-go-type-skip-optional-pointer: true
        note:
          type: string
          x-go-type-skip-optional-pointer: true
    RecipeContent:
      type: object
      additionalProperties: false
      required: [title, ingredients, steps]
      properties:
        title:
          type: string
        description:
          type: string
          x-go-type-skip-optional-pointer: true
        servings:
          type: string
          x-go-type-skip-optional-pointer: true
        notes:
          type: string
          x-go-type-skip-optional-pointer: true
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/NewIngredient"
        steps:
          type: array
          items:
            type: string
        tags:
          type: array
          x-go-type-skip-optional-pointer: true
          items:
            type: string
    SavedRecipeInput:
      type: object
      additionalProperties: false
      required: [title, ingredients, steps]
      properties:
        household_id:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
          x-go-type-skip-optional-pointer: true
        servings:
          type: string
          x-go-type-skip-optional-pointer: true
        notes:
          type: string
          x-go-type-skip-optional-pointer: true
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/NewIngredient"
        steps:
          type: array
          items:
            type: string
        tags:
          type: array
          x-go-type-skip-optional-pointer: true
          items:
            type: string
    PantryItem:
      type: object
      required: [name, quantity, added_at]
      properties:
        name:
          type: string
        quantity:
          type: number
          format: double
        added_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
          nullable: true
    EquipmentItem:
      type: object
      required: [name, added_at]
      properties:
        name:
          type: string
        category:
          type: string
          nullable: true
        added_at:
          type: integer
          format: int64
    OrderItem:
      type: object
      additionalProperties: false
      required: [name, quantity]
      properties:
        upc:
          type: string
          deprecated: true
          description: Legacy Kroger-only identifier. Use product instead.
        product:
          allOf:
            - $ref: "#/components/schemas/ProductReference"
          nullable: true
        name:
          type: string
        quantity:
          type: integer
        price:
          type: number
          format: double
          nullable: true
    Order:
      type: object
      required: [id, items, total_items, placed_at]
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total_items:
          type: integer
        estimated_total:
          type: number
          format: double
          nullable: true
        placed_at:
          type: integer
          format: int64
        location_id:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    RecordOrderInput:
      type: object
      additionalProperties: false
      required: [items, total_items, placed_at]
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total_items:
          type: integer
