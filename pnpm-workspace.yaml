allowBuilds:
  "@modelcontextprotocol/ext-apps": true
  "@mongodb-js/zstd": true
  core-js-pure: true
  esbuild: true
  node-liblzma: true
  sharp: true
  workerd: true
  "@sentry/cli": false

minimumReleaseAge: 0

overrides:
  "@ai-sdk/provider-utils@>=4.0.0 <4.0.33": "4.0.33"
  "undici@>=7.0.0 <7.29.1": "7.29.1"
  "@esbuild-kit/core-utils>esbuild": "0.25.0"

pmOnFail: ignore

packageExtensions:
  # Its types import @ai-sdk/provider without declaring it, so they resolve
  # the hoisted v4 copy from agents instead of the v3 copy ai@6 uses.
  "@openrouter/ai-sdk-provider@2":
    dependencies:
      "@ai-sdk/provider": "^3.0.0"
