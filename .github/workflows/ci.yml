name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Generate Worker types
        run: pnpm cf-typegen

      - parallel:
          - name: Lint
            run: pnpm exec oxlint && pnpm fmt:check

          - name: Typecheck
            run: pnpm exec tsc --noEmit && pnpm exec tsc --noEmit -p views/tsconfig.json

          - name: Test
            run: pnpm build:views && pnpm test

      - name: Build Worker
        run: pnpm build:worker

      - name: Prove baseline tool regressions
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          cp src/tools/inventory.ts /tmp/inventory-fixed.ts
          cp src/tools/cart.ts /tmp/cart-fixed.ts
          cp src/tools/shopping-list.ts /tmp/shopping-list-fixed.ts
          trap 'cp /tmp/inventory-fixed.ts src/tools/inventory.ts; cp /tmp/cart-fixed.ts src/tools/cart.ts; cp /tmp/shopping-list-fixed.ts src/tools/shopping-list.ts' EXIT
          git fetch origin main
          git show 62539df:src/tools/inventory.ts > src/tools/inventory.ts
          git show 62539df:src/tools/cart.ts > src/tools/cart.ts
          git show 62539df:src/tools/shopping-list.ts > src/tools/shopping-list.ts
          for title in 'applies every partial pantry removal' 'returns choices for duplicate exact' 'rejects fractional saved packages'; do
            set +e
            pnpm exec vitest run test/tools/list-views.test.ts test/tools/cart.test.ts -t "$title" > /tmp/baseline-current.log 2>&1
            result=$?
            set -e
            cat /tmp/baseline-current.log
            cat /tmp/baseline-current.log >> /tmp/tool-baseline.log
            test "$result" -ne 0
            grep -q 'AssertionError' /tmp/baseline-current.log
          done

      - name: Install browser
        run: pnpm exec e2e-web install chromium --with-deps

      - name: Prove baseline view regression
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          E2E_TELEMETRY_DISABLED: "1"
        run: |
          cp views/app/views/shopping-list.tsx /tmp/shopping-view-fixed.tsx
          trap 'cp /tmp/shopping-view-fixed.tsx views/app/views/shopping-list.tsx' EXIT
          git show 62539df:views/app/views/shopping-list.tsx > views/app/views/shopping-list.tsx
          set +e
          pnpm exec e2e run --grep 'edits a saved list' > /tmp/view-baseline.log 2>&1
          result=$?
          set -e
          cat /tmp/view-baseline.log
          test "$result" -ne 0
          grep -q 'ASSERTION_FAILED' /tmp/view-baseline.log
          cp -r .e2e /tmp/e2e-baseline

      - name: View regression journeys
        run: pnpm exec e2e run
        env:
          E2E_TELEMETRY_DISABLED: "1"

      - name: Upload regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reliability-evidence
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/results
            /tmp/tool-baseline.log
            /tmp/view-baseline.log
            /tmp/e2e-baseline
          retention-days: 7
