name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Generate Worker types
        run: pnpm cf-typegen

      - parallel:
          - name: Lint
            run: pnpm exec oxlint && pnpm fmt:check

          - name: Typecheck
            run: pnpm exec tsc --noEmit && pnpm exec tsc --noEmit -p views/tsconfig.json

          - name: Test
            run: pnpm build:views && pnpm test

      - name: Build Worker
        run: pnpm build:worker

      - name: Install browser
        run: pnpm exec e2e-web install chromium --with-deps

      - name: View regression journeys
        run: pnpm exec e2e run
        env:
          E2E_TELEMETRY_DISABLED: "1"

      - name: Upload regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: view-journeys
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/results
          retention-days: 7
