name: Agent Eval

# Runs test/evals/agent.eval.test.ts: free OpenRouter models drive the real
# MCP server (Kroger fixtures) through realistic shopping tasks. Results are
# reported in the job summary and as an artifact; task failures don't fail
# the workflow, since they are signal about the tool surface, not a broken build.

on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated OpenRouter model ids (blank = suite defaults)
        required: false
        default: ""
      tasks:
        description: Comma-separated task ids (blank = all)
        required: false
        default: ""
  pull_request:
    branches: [main]
    paths:
      - src/tools/**
      - src/prompts.ts
      - src/server.ts
      - src/utils/format-response.ts
      - test/evals/agent/**
      - test/evals/agent.eval.test.ts

permissions:
  contents: read

concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-eval:
    name: Agent Eval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build:views
      - name: Run agent eval
        id: eval
        continue-on-error: true
        run: pnpm eval:agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # PRs use two models to stay well inside the free daily request quota.
          EVAL_MODELS: ${{ inputs.models || (github.event_name == 'pull_request' && 'stealth/space-bunny-alpha,qwen/qwen3.8-27b:free') || '' }}
          EVAL_TASKS: ${{ inputs.tasks }}
      - name: Summarize
        if: always() && hashFiles('eval-results/agent.json') != ''
        run: node scripts/eval-agent-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-eval-results
          path: eval-results/
          if-no-files-found: ignore
